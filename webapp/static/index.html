<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS — Sovereign Agent Harness</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/icons.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-words"><b>ATLAS</b><span id="version">loading...</span></span>
      </div>

      <!-- THE ONE ACTION, PINNED. Booting is the most-pressed thing in this
           console and it lived three cards down a page. It is context-aware:
           with an engine standing it becomes Close, because closing PAYS THE
           TOLL and that is the act the record depends on. -->
      <button class="side-primary" id="side-primary" type="button">Boot an engine</button>

      <!-- THE PALETTE, MADE VISIBLE. Ctrl+K has worked since it was built and
           nothing on screen said so, which is the same as not having it. This
           is a button that looks like a search field because that is what it
           does; the palette itself is the input. -->
      <button class="side-search" id="side-search" type="button">
        <span>Search</span><kbd>Ctrl K</kbd>
      </button>
      <div class="nav" id="nav">
        <!-- data-icon is GONE from these lines. It carried six characters
             from four different Unicode families (BLACK SQUARE, PENCIL,
             FISHEYE, CHECK MARK, TRIGRAM FOR HEAVEN, ATOM SYMBOL), each
             drawn by whatever font owned it, at its own weight and baseline
             -- which is why they never looked like a set. The glyphs now
             come from css/icons.css, keyed off data-page, one grid and one
             stroke, masked over currentColor so they take the link's own
             colour through idle, hover and active. -->
        <div class="nav-section">Work</div>
        <a href="/" class="nav-link active" data-page="dashboard">Dashboard</a>
        <!-- THE LABEL is Watchboard; the route and data-page stay "chat" on
             purpose, exactly as flows did when it became Version control: the
             route is what every link, bookmark and history entry points at,
             and data-page is the key css/icons.css draws the glyph from.
             Renaming the label is the operator's word (2026-09-10); renaming
             the route would break things for a word. -->
        <a href="/chat" class="nav-link" data-page="chat">Watchboard</a>
        <a href="/agents" class="nav-link" data-page="agents">Agents<span class="nav-badge" id="badge-agents" hidden></span></a>
        <div class="nav-section">Record</div>
        <a href="/evals" class="nav-link" data-page="evals">Evals</a>
        <a href="/records" class="nav-link" data-page="records">Records<span class="nav-badge" id="badge-records" hidden></span></a>
        <!-- The LABEL is Version control; the route and data-page stay
             "flows" on purpose -- the route is what every existing link,
             bookmark and history entry points at, and data-page is the key
             css/icons.css draws the glyph from. Renaming the label is the
             operator's word (2026-09-10); renaming the route would break
             things for a word. -->
        <a href="/flows" class="nav-link" data-page="flows">Version control<span class="nav-badge" id="badge-flows" hidden></span></a>
        <!-- TOOLS IS BACK, 2026-09-10, at the operator's word: the skills
             ARE the useful part, and this is "a platform for writing stuff
             up as markdown skills". Its route, page and handler never left.
             Traces and Playground stay parked by the same ruling in the
             same breath -- Traces has no job yet ("i dont know what that
             would even be"), and Playground waits on the coding space. -->
        <div class="nav-section">System</div>
        <a href="/tools" class="nav-link" data-page="tools">Tools<span class="nav-badge" id="badge-tools" hidden></span></a>
        <a href="/settings" class="nav-link" data-page="settings">Settings</a>
        <!-- FLOWS IS BACK ON THE PANEL, 2026-09-10, at the operator's word
             ("flows.. put it in there"). Version control IS a flow, and the
             kinds already say so: a `gate` node holds the six proofs and
             PAUSES for him -- RULE 6 by construction rather than by a button
             -- a `run` node puts git_cycle through the council, and the run
             persists in flows/runs.jsonl, which is the tracking and the
             review he asked for. Nothing new was built to reach it: flows.js
             was already loaded below and every /api/flows route already
             stood. The page was one uncomment from being back, exactly as
             the note beneath says. -->
        <!-- OFF THE PANEL, not removed. The routes, pages and handlers all
             stand; each line below is one uncomment from being back. -->
        <!-- <a href="/messages" class="nav-link" data-page="messages" data-icon="&#9993;">Messages</a>  (off the panel 2026-09-09 at the operator's word: "we can talk about what they are for later"; the pages and their routes are untouched) -->
        <!-- <a href="/traces" class="nav-link" data-page="traces" data-icon="&#9656;">Traces</a>  (off the panel 2026-09-09 at the operator's word: "we can talk about what they are for later"; the pages and their routes are untouched) -->
        <!-- Tools came back on 2026-09-10 and now sits above, before Settings. -->
        <!-- <a href="/playground" class="nav-link" data-page="playground" data-icon="&#9874;">Playground</a>  (parked 2026-09-09; kept parked 2026-09-10: "playground could be the coding space, once that is built") -->
        <!-- Flows came back on 2026-09-10 and now sits above, with Settings. -->
      </div>
      <div class="sidebar-footer">
        <div class="status-dot" id="status-dot"></div>
        <span id="operator-status">connecting...</span>
        <div class="covenant">covenant: 1512741580b7239b</div>
      </div>
    </nav>
    <main class="main">
      <!-- ONE CRUMB, PAINTED BY THE ROUTER. It lives here rather than in each
           page's own header because the router is the only thing that knows
           where you are, and fourteen hand-written copies of the same line is
           fourteen chances for one of them to be wrong. -->
      <div class="crumb" id="crumb" hidden></div>
      <div id="content">
        <div class="loading">Loading...</div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal" style="display:none">
    <div class="modal-backdrop" onclick="App.closeModal()"></div>
    <div class="modal-content" id="modal-content"></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/home.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/council.js"></script>
  <script src="/js/prompts.js"></script>
  <script src="/js/flows.js"></script>
  <script src="/js/palette.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
