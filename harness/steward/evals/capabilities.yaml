# Steward's capability map, machine-readable (ADR-0012; spec 001, docs/specs/001-capability-evals.md, is the human
# document and its inventory tables hold the same ids). One entry per capability: its id, what correct use looks
# like (title), where the record asks for it (source), the tier its case belongs to (tier), and, where it is one,
# the skill folder (skill) or the tools of Steward's (tools) it is the capability of. required: true once its case has
# landed: evals.py validate then fails if no case names it. A new skill folder or a new tool of Steward's fails
# validate until an entry here names it, and every eval case names its capability ids (capability:).
# The operator, 2026-11-05: "all modules and skills, any capabilities always come with an eval set for testing.
# Everything Steward does has an eval, and he can prove himself."
# withheld: true (2026-11-08, ExecPlan 0005 M9): taken out of his build until the operator's word; its tools are the
# withheld ones, and validate fails if his build or an eval's stand-in offers one. Never required.
# Profiles (ADR-0018, 2026-11-08): each capability ExecPlan 0005 builds names the harness profile that serves it, as a
# comment on its id line (`# profile: <name>`, spec 002), until the profile mechanism teaches validate a `profile` key
# (validate refuses unknown keys today). A profile's cases are its eval; every case names its profile (spec 003).
capabilities:
  - id: A1
    title: "A change request gets a plan first: an `approval` card with one question and short, named, non-empty steps"
    source: "Charter, How a request runs 1; ARCH 4"
    tier: T0
