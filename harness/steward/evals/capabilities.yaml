# Steward's capability map, machine-readable (ADR-0012; spec 001, docs/specs/001-capability-evals.md, is the human
# document and its inventory tables hold the same ids). One entry per capability: its id, what correct use looks
# like (title), where the record asks for it (source), the tier its case belongs to (tier), and, where it is one,
# the skill folder (skill) or the tools of Steward's (tools) it is the capability of. required: true once its case has
# landed: evals.py validate then fails if no case names it. A new skill folder or a new tool of Steward's fails
# validate until an entry here names it, and every eval case names its capability ids (capability:).
# The operator, 2026-11-05: "all modules and skills, any capabilities always come with an eval set for testing.
# Everything Steward does has an eval, and he can prove himself."
capabilities:
  - id: A1
    title: "A change request gets a plan first: an `approval` card with one question and short, named, non-empty steps"
    source: "Charter, How a request runs 1; ARCH 4"
    tier: T0
  - id: A2
    title: "A plain question, or a request only to read or report, gets a plain answer: no plan, no card"
    source: "Charter, How a request runs 1; ARCH 4"
    tier: T2
    tools: [get_repo_status]
  - id: A3
    title: "A direct ask (his tool named with its arguments) goes straight to the plan, offered only the Estate's reads"
    source: "ARCH 4; ADR-0009"
    tier: T3
  - id: A4
    title: "A denied plan: nothing runs"
    source: "Charter, How a request runs 2; ARCH 4"
    tier: T2
    required: true
  - id: A5
    title: "Execute: the plan's steps are his todos, each marked complete when done, never redone"
    source: "Charter, How a request runs 3"
    tier: T0
  - id: A6
    title: "A No on a write card ends the run; nothing after it runs"
    source: "ARCH 4 (\"A No on any card ends the run\")"
    tier: T2
  - id: A7
    title: "Check and repair: the tests run after changes; a failure is said, then repaired, three attempts at most"
    source: "Charter, How a request runs 4; ARCH 1 (Steward, inside)"
    tier: T2
  - id: A8
    title: "Commit: one specific line, raised on the `git_commit` card by the workflow; never asked about in words"
    source: "Charter, How a request runs 5"
    tier: T0
    tools: [git_commit, atlas_git_commit]
  - id: A9
    title: "Report once: what ran and what the checks showed; no repeated answer, no harness reminder repeated"
    source: "Charter, How a request runs 6"
    tier: T2
  - id: A10
    title: "Tools are called as tools, never written out as text"
    source: "Charter, How a request runs 1"
    tier: T2
  - id: A11
    title: "A reply written on a card is Kyle's instruction and is followed"
    source: "Charter, Your tools (last line)"
    tier: T2
