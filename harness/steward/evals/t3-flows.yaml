# T3: the Flows shelf's tools on Jesster's MCP (ADR-0017): a saved flow asked for by name is found in saved_flows, run
# with saved_flow_run on its own card after the plan, and how a run went is read with saved_flow_status, with no plan.
# The standins runner: each case once through the workflow in an eval's build, the Flows shelf's tools as stand-ins
# (evals.STAND_INS; saved_flow_run declaration-only, its card denied), so no flow runs and nothing changes.
# Run: python harness/steward/step04_production_ready/evals.py flows
# The cases are fingerprinted in baselines.json: a change to any case or check is a new version (see README.md).
name: flows
tier: T3
version: 1
owner: operator
runner: standins
split: full
bar: {passed: 2, of: 2, runs_in_a_row: 2}
changes:
  1: >-
    ADR-0017's first two cases (2026-11-08): run_drift_check_by_name (D4, D5: "Run the Repo drift check flow." finds
    the flow's id in saved_flows, reaches the plan card first, then calls saved_flow_run with that id on its own card,
    which is denied, and nothing runs after the No) and startup_this_morning (D4, D6: "How did Startup do this
    morning?" reads saved_flow_status and answers from its failed step's reason, with no card and no change).
cases:
  - id: run_drift_check_by_name
    capability: [D4, D5]
    ask: Run the Repo drift check flow.
    stand_ins:
      - name: secondbrain_saved_flows
        result: >-
          [{"id": "f-startup", "name": "Startup", "steps": ["pull_ff", "versions", "repo_log", "merged_prs", "releases",
          "eval_bars", "plan_left"], "when": "weekdays 06:00", "running": false, "waiting": null, "lastRun":
          "2026-11-08T13:00:00.000Z", "lastResult": "ok"}, {"id": "f-drift", "name": "Repo drift check", "steps":
          ["versions", "repo_log"], "when": "", "running": false, "waiting": null, "lastRun": null, "lastResult": null},
          {"id": "f-bfcl", "name": "Eval: bfcl", "steps": [{"step": "eval_start", "sets": ["bfcl"], "runs": 1},
          {"step": "eval_wait", "hours": 8}], "when": "", "running": false, "waiting": null, "lastRun": null,
          "lastResult": null}]
      - name: secondbrain_saved_flow_run
    approve: [approve_plan]
    tools_called: [secondbrain_saved_flows]
    expected_tool_calls:
      - {name: secondbrain_saved_flow_run, arguments: {id: f-drift}}
    checks: [plan_card_first, tool_called_check, tool_call_args_match, nothing_ran_after_no]
  - id: startup_this_morning
    capability: [D4, D6]
    ask: How did Startup do this morning?
    stand_ins:
      - name: secondbrain_saved_flows
        result: >-
          [{"id": "f-startup", "name": "Startup", "steps": ["pull_ff", "versions", "repo_log", "merged_prs", "releases",
          "eval_bars", "plan_left"], "when": "weekdays 06:00", "running": false, "waiting": null, "lastRun":
          "2026-11-08T13:00:00.000Z", "lastResult": "Failed: pull_ff: worlds/jesster is not on main (flows-e2e)"},
          {"id": "f-drift", "name": "Repo drift check", "steps": ["versions", "repo_log"], "when": "", "running": false,
          "waiting": null, "lastRun": null, "lastResult": null}]
      - name: secondbrain_saved_flow_status
        result: >-
          {"id": "f-startup", "name": "Startup", "run_id": "20261108-130000-a1b2", "state": "failed", "trigger":
          "schedule", "started": "2026-11-08T13:00:00Z", "ended": "2026-11-08T13:00:41Z", "steps": [{"step": "pull_ff",
          "state": "failed", "ms": 4100, "ok": false}, {"step": "versions", "state": "skipped", "ms": null}, {"step":
          "repo_log", "state": "skipped", "ms": null}], "reason": "pull_ff: worlds/jesster is not on main (flows-e2e)"}
    tools_called: [secondbrain_saved_flow_status]
    keywords: [jesster]
    checks: [no_card, no_change_made, tool_called_check, keyword_check]
