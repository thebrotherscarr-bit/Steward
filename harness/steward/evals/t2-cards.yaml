# T2, his own work: the cards he raises, scored on the plan card alone (the plans runner, every card denied, nothing
# runs). ADR-0013 (the A2UI pilot) and ExecPlan 0004: the plan card comes with its A2UI surface, built from the plan.
# Run: python harness/steward/step04_production_ready/evals.py cards
# The cases are fingerprinted in baselines.json: a change to any case or check is a new version (see README.md).
name: cards
tier: T2
version: 2
owner: operator
runner: plans
split: full
bar: {passed: 1, of: 1, runs_in_a_row: 2}
changes:
  1: >-
    The A2UI pilot's case (ADR-0013, 2026-11-05): the operator's acceptance ask from ExecPlan 0003 and 0004. Its plan
    card must come with the card's A2UI v0.9 surface on the basic catalog, an approve and a deny Button carrying the
    card's id, and a Text for every step of the plan (plan_card_surface, no model).
  2: >-
    2026-11-08: v1 asked for a docstring convert_length already has (units.py line 8), so the ask asked for what was
    there. It now asks for a function units.py lacks, celsius_to_kelvin, and names its precondition
    (celsius_to_kelvin_works must fail on the fixture), which validate measures. The check is unchanged.
cases:
  - id: plan_card_a2ui
    capability: [A13]
    ask: Add a function celsius_to_kelvin to harness/steward/working/sample-project-2/units.py.
    subject: [celsius_to_kelvin]
    precondition: celsius_to_kelvin_works
    max_calls: 8
    checks: [plan_card_surface]
