# Profile 1, the operator's example (ADR-0018; spec 002; ExecPlan 0005, Operation MP): run one eval set from the phone or
# the Agent tab and report it. Only the Estate's reads and the eval and saved-flow actions are offered; one eval set per
# request (profiles.PROFILE_REFUSALS holds the extra refusal in code).
name: eval-runner
version: 1
for:
  task: "run one eval set (or a saved eval flow) from the phone or the Agent tab, and say how a run did"
  capability: [A3, C6, N8]
tools:
  - secondbrain_estate_status
  - secondbrain_estate_logs
  - secondbrain_approvals_history
  - secondbrain_hold_status
  - secondbrain_eval_status
  - secondbrain_saved_flows
  - secondbrain_saved_flow_status
  - secondbrain_eval_start
  - secondbrain_saved_flow_run
instructions: |
  One eval set per request: plan one eval_start with the set and the tag the request names, as your one step.
  A saved eval flow the request names is run with saved_flow_run instead, by its id from saved_flows.
  Read nothing else first: no code, no files, no skills.
  After the run starts, read eval_status once and say whether it began.
  Asked how a run did, read eval_status for its tag once, and give the pass count and each failed case.
read_budget: 2
reasoning: low
# What a model must offer to wear it (STEW spec/profile.md; ExecPlan 0006 P2): tool calling when it offers tools;
# min_context is to be measured (the smallest window its cases pass with), null until it is; its reasoning
# effort is sent only when the binding offers the knob, so it does not require it.
requires: {tool_calling: true, min_context: null, reasoning_effort: false}
gates:
  bounds: [keys, archive, untrusted-shell, sitting, whatsapp]
  extra: ["one eval set per request: a request for every set, or several at once, is refused in words"]
card: yes
success: tool_call_args_match
summary: "<set> <tag>: started, or <passed>/<total>, failed: <case ids>"
