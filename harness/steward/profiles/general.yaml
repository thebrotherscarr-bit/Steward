# The general profile (ADR-0018; ExecPlan 0005, Decision Log 2026-11-08): today's whole harness, unchanged. Its tools are
# every tool Steward's build offers (his own, as capabilities.yaml names them, and the MAF harness's own), so it cuts
# nothing; its reading budget is EXPLORE's (ADR-0015), and medium is gpt-oss's own default reasoning effort. Every case
# starts here; narrow profiles take their families from it in the frozen order, and `for` loses their ids as they go.
name: general
version: 1
for:
