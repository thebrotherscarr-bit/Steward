[project]
name = "steward"
version = "0.1.0"
description = "STEWARD: a Microsoft Agent Framework agent on local Ollama"
requires-python = ">=3.10"
dependencies = [
    "agent-framework",
    "agent-framework-ollama",
    "agent-framework-tools",
    "agent-framework-monty",
    "agent-framework-foundry",
    "agent-framework-foundry-hosting",
    "python-dotenv",
    "textual>=6.2.1",
    "rich>=13.7.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["steward"]
