# THE GATE: A CHANGE TO STEWARD IS KEPT ONLY IF THIS PASSES.
#
# Nigel's approach for Steward: a pull request, checks that must pass, and the
# merge into main as the approval gate. It starts with the simplest gate and
# grows one step at a time.
#
# STAGE 1, the simplest gate. No model, no GPU, no network beyond the install:
#   compile  every Python file in the repo parses (python -m compileall), so a
#            broken edit never reaches main.
#   sample   the sample project's own tests pass at the committed state
#            (working/sample-project). The evals plant the discount bug in the
#            working copy only; what is committed must stay green.
#
# STAGE 2 (ADR-0001: small checks, not model-run evals):
#   harness  Steward's harness checked with no model, as Microsoft's builder skill
#            validates a harness: his modes, memory, skills and file root are
#            offered; git_commit and file writes wait for approval; reads don't;
#            the harness loop stops at its bound; DevUI serves him and streams each
#            run's trace (devui_app.py); MCP hosting serves him as one tool whose
#            session_id continues a conversation (mcp_app.py); the improvement loop's
#            workflow passes approvals to Kyle, sends failing checks back to Steward and
#            resumes a review from its checkpoint (improvement_loop_workflow.py). A scripted chat client, composed
#            like MAF's own test client, stands in for Ollama (test_harness.py).
#            The MAF packages are pinned to the versions Steward runs on.
#
# Each later stage is one more step here. Anything that needs Steward's model
# (gpt-oss:20b) runs on this PC: GitHub's runners have no GPU.
name: gate

# Proved once per line: by its pull request, main by its own push, and any line
# by hand (workflow_dispatch), as Manjuel's prove.yml does.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push on the same ref cancels the older run.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: compile
        run: python -m compileall -q .
      - name: sample
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q harness/steward/working/sample-project
      - name: harness
        run: |
          python -m pip install --quiet agent-framework-core==1.23.0 agent-framework-ollama==1.0.0b261022 agent-framework-tools==1.0.0b261022 agent-framework-monty==1.0.0b261015 agent-framework-devui==1.0.0b261022 agent-framework-hosting-mcp==1.0.0a261030 mcp==2.3.0 tenacity==9.1.4 httpx2==2.16.0 python-dotenv==1.2.4
          python -m pytest -q -p no:cacheprovider harness/steward/step04_production_ready/test_harness.py
