# THE GATE: A CHANGE TO STEWARD IS KEPT ONLY IF THIS PASSES.
#
# Nigel's approach for Steward: a pull request, checks that must pass, and the
# merge into main as the approval gate. It starts with the simplest gate and
# grows one step at a time.
#
# STAGE 1, the simplest gate. No model, no GPU, no network beyond the install:
#   compile  every Python file in the repo parses (python -m compileall), so a
#            broken edit never reaches main.
#   sample   the sample projects' own tests pass at the committed state
#            (working/sample-project and sample-project-2). The evals plant their
#            bugs in the working copy only; what is committed must stay green.
#   evals    the eval set files are valid (evals.py validate, no model).
#
# STAGE 2 (ADR-0001: small checks, not model-run evals):
#   harness  Steward's harness checked with no model, as Microsoft's builder skill
#            validates a harness: his modes, memory, skills and file root are
#            offered; git_commit and file writes wait for approval; reads don't;
#            the harness loop stops at its bound; DevUI serves him and streams each
#            run's trace (devui_app.py); MCP hosting serves him as one tool whose
#            session_id continues a conversation (mcp_app.py); in plan mode his Responses
#            service asks for the console's PlanningResponse and an Approve switches him
#            to execute (hosted.py); the improvement loop's
#            workflow passes approvals to Kyle, sends failing checks back to Steward and
#            resumes a review from its checkpoint (improvement_loop_workflow.py). A scripted chat client, composed
#            like MAF's own test client, stands in for Ollama (test_harness.py).
#            It installs requirements.lock (pyproject.toml's pins and the test extra, every
#            dependency below them and the build backend pinned with its hashes), then the
#            project itself with no deps.
#
# STAGE 3 (ExecPlan 0006 P8, ADR-0019 migration step 1):
#   stew     every tracked .us file (git ls-files "*.us": binding.us, the eval bindings, and each one added later)
#            passes STEW's own validator, tools/validate.py, checked out from github.com/thebrotherscarr-bit/STEW at the
#            commit pinned in the "stew checkout" step's ref. A bump of the pin is a change of its own, made here by hand.
#
# Each later stage is one more step here. Anything that needs Steward's model
# (gpt-oss:20b) runs on this PC: GitHub's runners have no GPU.
name: gate

# Proved once per line: by its pull request, main by its own push, and any line
# by hand (workflow_dispatch), as Manjuel's prove.yml does.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push on the same ref cancels the older run.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Pinned, as everything the gate runs on (2026-11-04): the image ubuntu-latest resolved to that day (runner image
    # ubuntu26 20261025.179), each action by its commit (its release in the comment), Python to the patch, pip
    # exactly, and every package by requirements.lock's hashes. A bump is a change of its own, made here by hand.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: compile
        run: python -m compileall -q .
      - name: stew checkout
        # STEW at a pinned commit (main, 2026-11-08: "Samples 01 to 05"), beside the repository, untracked by it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thebrotherscarr-bit/STEW
          ref: aec5527ebe25c366057674b558e31e6a5e284881
          path: .stew
          persist-credentials: false
      - name: stew
        # Standard library only, so it runs before the install. No .us file tracked is itself a failure.
        run: |
          git ls-files -z "*.us" > "$RUNNER_TEMP/us-files"
          test -s "$RUNNER_TEMP/us-files" || { echo "FAIL: no tracked .us file"; exit 1; }
          xargs -0 python .stew/tools/validate.py < "$RUNNER_TEMP/us-files"
      - name: install
        run: |
          python -m pip install --quiet pip==26.3
          # --no-deps, as pip-sync installs a lock: the lock is the whole set (resolved on Windows, the Windows-only
          # pair marked; requirements-lock.in), so pip resolves nothing and never reaches past it, e.g. for uvloop.
          python -m pip install --quiet --require-hashes --no-deps -r requirements.lock
          python -m pip install --quiet --no-deps --no-build-isolation .
      - name: sample
        run: python -m pytest -q harness/steward/working/sample-project harness/steward/working/sample-project-2
      - name: evals
        # Every eval set file in harness/steward/evals/ checked with no model (evals.py validate): schema, checks,
        # a RESULT check per case, each precondition failing on its fixture, and each version's fingerprint.
        run: python -W ignore harness/steward/step04_production_ready/evals.py validate
      - name: harness
        run: python -m pytest -q -p no:cacheprovider harness/steward/step04_production_ready/test_harness.py
